version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JUDGE_QUEUE_ENABLED=true
    depends_on:
      - redis
    restart: unless-stopped

  judge-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["uv", "run", "python", "judge_worker.py"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JUDGE_QUEUE_ENABLED=true
    depends_on:
      - redis
    restart: unless-stopped
