version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JUDGE_QUEUE_ENABLED=true
      - RATE_LIMIT_PER_MINUTE=100
      - CHAT_MODEL=gpt-4o-mini
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  judge-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["uv", "run", "python", "judge_worker.py"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JUDGE_QUEUE_ENABLED=true
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep 'judge_worker.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
