[project]
name = "ai-job-search-project-2"
version = "0.1.0"
description = "Multi-tenant agentic RAG platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "litellm>=1.74.0",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "torch>=2.2.0",
    "sentence-transformers>=5.1.0",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.9",
    "langsmith>=0.11.2",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.40.0",
    "requests>=2.32.0",
    # Official Google Agent-to-Agent (A2A) protocol SDK. The in-tree agents
    # implement the A2A wire format (AgentCard + JSON-RPC message/send) directly
    # so they run on the current lockfile; this SDK is declared for teams that
    # prefer the official client. Re-run `uv lock` after adding it.
    "a2a-sdk>=0.3.0",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "deepeval>=4.2.0",
    "pytest>=9.1.1",
]
