# Run from the repo root:  docker compose -f deploy/docker-compose.yml up --build
# The build context is the repo root (..) because the Dockerfile copies
# pyproject.toml, uv.lock and src/ from there; .dockerignore stays at the root.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tessera-api:local
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # Point the A2A supervisor at the dedicated Drafter/Judge agent services.
      TESSERA_DRAFTER_URL: "http://drafter-agent:8001"
      TESSERA_JUDGE_URL: "http://judge-agent:8002"
      TESSERA_A2A_MODE: "http"
    depends_on:
      - drafter-agent
      - judge-agent
    restart: unless-stopped

  drafter-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tessera-drafter-agent:local
    command: uv run python -m src.agents.drafter_agent
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    restart: unless-stopped

  judge-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tessera-judge-agent:local
    command: uv run python -m src.agents.judge_agent
    ports:
      - "8002:8002"
    env_file:
      - ../.env
    restart: unless-stopped

  frontend:
    image: tessera-api:local
    depends_on:
      - api
    command: uv run streamlit run src/ui/app_streamlit_auth.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      TESSERA_API_BASE: "http://api:8000"
    env_file:
      - ../.env
    restart: unless-stopped
